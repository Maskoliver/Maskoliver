<svg xmlns="http://www.w3.org/2000/svg" width="400" height="88" viewBox="0 0 400 88" role="img" aria-label="Current focus: exploring local and commercial AI models."><title>Current focus: exploring local and commercial AI models.</title><style>
 .pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}.scan{animation:scan 8s linear infinite}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
 @keyframes scan{from{transform:translateX(-160px)}to{transform:translateX(1040px)}}
 @media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan{animation:none}.scan{opacity:0}}
 </style><rect x="1" y="1" width="398" height="86" rx="10" fill="#111C1A" stroke="#30443E"/>
 <circle class="pulse" cx="21" cy="25" r="4" fill="#9CEAC2"/>
 <text x="34" y="29" fill="#A3B6AD" font-size="11" letter-spacing="1.3" font-family="Consolas,monospace">CURRENT FOCUS</text>
 <text x="18" y="58" fill="#D7E9DE" font-size="15" font-family="Consolas,monospace">exploring local + commercial AI</text>
 <rect class="cursor" x="282" y="44" width="8" height="17" fill="#9CEAC2"/></svg>